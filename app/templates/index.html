<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header class="page-header">
        <h1>Mein Expense Tracker</h1>
        <p>Einnahmen und Ausgaben im Überblick</p>
    </header>

    <main class="page-content">
        <section class="panel" aria-labelledby="form-title">
            <h2 id="form-title">Buchung hinzufügen</h2>
            <form>
                <label for="transaction-type">Art der Buchung</label>
            </label>
            <select id="transaction-type" name="transaction-type">
                <option value="expense">Ausgabe</option>
                <option value="income">Einnahme</option>
            </select>
            <labelfor="amount">Betrag in Euro</label>
            <input id ="amount" name="amount" type="number" min="0.01" step="0.01" required>
            <label for="category">Kategorie</label>
            <input id="category" name="category" type="text" required>
            <label for="date">Datum</label>
            <input id="date" name="date" type="text" required>
            <label description">Beschreibung</label>
            <input id="description" name="description" type="text">
            <button type="button">Speichern</button>
            </form>
        </section>
        <section class="panel" aria-labelledby="transactions-title">
            <h2 id="transactions-title">Buchungen</h2>
            <table>
                <thead>
                    <tr>
                        <th>Datum</th>
                        <th>Beschreibung</th>
                        <th>Kategorie</th>
                        <th>Art</th>
                        <th>Betrag (€)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>21.11.2026</td>
                        <td>Beispielbuchung</td>
                        <td>Lebensmittel</td>
                        <td>Ausgabe</td>
                        <td>12,50 €</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
